name: Check the comparison
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m what_changed samples/before.md samples/after.md --out reports/smoke
      - run: python -m pip install .
      - run: what-changed samples/before.md samples/after.md --out reports/installed
