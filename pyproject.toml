[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "what-changed-local"
version = "0.1.0"
description = "A second look at a renewal: compare clauses, check the numbers, keep the receipts."
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.scripts]
what-changed = "what_changed.cli:main"

[tool.setuptools.packages.find]
include = ["what_changed*"]

[tool.setuptools.package-data]
what_changed = ["report.html"]
